server {
 listen 443 ssl;
 ssl_certificate /certificates/server.crt;
 ssl_certificate_key /certificates/server.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; client_max_body_size 6m; }
 location /health/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location / { try_files $uri $uri/ /index.html; }
}
